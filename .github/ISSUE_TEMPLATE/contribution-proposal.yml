name: 贡献提案
description: 想动手？先选路径 —— 六条贡献路径全都绕开了 engine.py。
title: "[contribution] "
labels: ["contribution"]
body:
  - type: dropdown
    id: path
    attributes:
      label: 你想走哪条贡献路径？
      description: 与 CONTRIBUTING.md 第 3 节一一对应，任选其一即可。
      options:
        - "1. SQL / 迁移脚本（sql/*.sql）"
        - "2. n8n 工作流（n8n/workflows/*.json）"
        - "3. 解析器纯函数（omnilore/parsers.py）"
        - "4. 测试用例（tests/*）"
        - "5. 文档与示例（README / docs / CHANGELOG）"
        - "6. CLI 与首次使用体验（cli.py / bootstrap.py）"
        - "7. 我想改 omnilore/engine.py（请先说明理由）"
    validations:
      required: true

  - type: dropdown
    id: experience
    attributes:
      label: 你的上手程度
      options:
        - "第一次给这个项目贡献"
        - "已经跑过 60 秒验证"
        - "跑过测试套件"
        - "已经是常客"
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: 预计改动规模
      options:
        - "小（< 50 行）"
        - "中（50 ~ 300 行）"
        - "大（> 300 行，先讨论再动手）"
    validations:
      required: true

  - type: dropdown
    id: dco
    attributes:
      label: 你是否会使用 `git commit -s` 签署 DCO？
      options:
        - "是，我会用 -s"
        - "不确定 DCO 是什么（请在回复里说明，我来补）"
        - "不愿签署 DCO（那么很遗憾，我们无法合并该提交）"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你想做什么（几句话即可）
    validations:
      required: true
